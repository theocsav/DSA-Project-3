name: Temporary Wayback Snapshot Download

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install downloader dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Download and localize Wayback snapshot
        run: python tools/fetch_wayback_snapshot.py

      - name: Upload website ZIP
        uses: actions/upload-artifact@v4
        with:
          name: pickle-whisper-wayback-20250914214303
          path: output/pickle-whisper-wayback-20250914214303.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
