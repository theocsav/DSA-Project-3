name: Temporary Wayback Wget Mirror

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Mirror snapshot with wget
        run: bash tools/fetch_wayback_wget.sh

      - name: Upload website ZIP
        uses: actions/upload-artifact@v4
        with:
          name: pickle-whisper-wayback-20250914214303-wget
          path: output/pickle-whisper-wayback-20250914214303-wget.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
